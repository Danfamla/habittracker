</div>

<svg id="logo" class="lg play" viewBox="0 0 96 96" width="104" height="104" role="img" aria-label="Anew logo"><g class="pop"><rect width="96" height="96" rx="26" style="fill:var(--acc)"/><g class="lt"><rect x="6" y="62" width="13" height="18" rx="3" style="fill:var(--accink)"/><path class="fl" d="M12.5 61C8 56 12 54 12.5 49C17 54 17 57 12.5 61Z" fill="#ffd23f"/></g><g class="in"><g class="cig"><rect x="14" y="44" width="38" height="7" rx="2" style="fill:var(--accink)"/><rect x="52" y="44" width="12" height="7" rx="2" style="fill:var(--accink);opacity:.6"/></g><g class="em"><path class="sm" d="M15 41c-4-3 4-5 0-8c-3-3 3-4 1-7" style="stroke:var(--accink);fill:none" stroke-width="3" stroke-linecap="round"/><rect class="ember" x="12" y="44" width="6" height="7" rx="2.5" style="fill:var(--accink)"/></g><g style="fill:var(--accink);opacity:.3"><rect x="60" y="36" width="44" height="34" rx="14"/><rect class="f1" x="34" y="38" width="36" height="9.5" rx="4.75"/><rect class="f2" x="34" y="48.5" width="36" height="9.5" rx="4.75"/><rect x="44" y="58" width="18" height="9" rx="4.5"/></g></g><g class="lift2"><g class="db" style="fill:var(--accink)"><rect x="30" y="45" width="36" height="6" rx="3"/><rect x="20" y="32" width="8" height="32" rx="3"/><rect x="68" y="32" width="8" height="32" rx="3"/></g><g class="hand2"><g style="fill:var(--accink);opacity:.3"><rect x="38" y="62" width="20" height="52" rx="8"/><rect x="34" y="52" width="28" height="18" rx="7"/><rect x="34" y="41" width="6" height="17" rx="3"/><rect x="41" y="41" width="6" height="17" rx="3"/><rect x="48" y="41" width="6" height="17" rx="3"/><rect x="55" y="41" width="6" height="17" rx="3"/><rect x="29" y="50" width="8" height="12" rx="4"/></g></g></g></g></svg>
<h1 id="appname">Anew</h1>
<p id="tag"></p>
<button class="btn pri big" id="go"></button>
<div class="by" id="by"></div>
</section>
<main id="app" hidden>
<header><button class="btn" id="home2"></button><h1><button class="homebtn" id="home">Anew</button></h1></header>
<nav class="tabs" role="tablist"><button role="tab" data-tab="progress" id="tabP"></button><button role="tab" data-tab="habits" id="tabH"></button></nav>
<div id="pProgress"><section class="hero" id="hero"></section>
<section id="list"></section></div>
<div id="pHabits" hidden><div id="hlists"></div>
<section class="add card">
<h2 id="addTitle"></h2>
<div class="row"><input type="text" id="newName" maxlength="60"></div>
<div class="row type" style="margin-top:8px"><button class="btn" data-type="bad" id="tBad"></button><button class="btn" data-type="good" id="tGood"></button><button class="btn pri" id="addBtn" style="margin-left:auto"></button></div>
</section>
</div>
</main>
<script>
const DAY=864e5, MS=[1,7,30,90,365];
const T={
en:{days:n=>n===1?'day':'days',hero:'Longest current streak',sub:n=>n+(n===1?' habit':' habits')+' tracked',bad:'Quitting',good:'Building',
slip:'I slipped',check:'Check in today',checked:'Checked in today',del:'Delete',confirm:'Delete this habit?',best:'Best',next:(n,d)=>'Next milestone: '+n+' days ('+d+' to go)',top:'Top milestone reached',
tag:'Count the days you stay on track.',go:'Start changing',tabP:'Progress',tabH:'Habits',sbad:'Bad habits',sgood:'Good habits',none:'Nothing here yet.',by:'by Danfamla',name:'Anew',home:'‹ Home',light:'Light theme',dark:'Dark theme',add:'Add a habit',ph:'What do you want to quit or build?',tBad:'Quit a habit',tGood:'Build a habit',addBtn:'Add habit',empty:'No habits yet. Add your first one below.',s1:'Scrolling social media',s2:'Reading 10 pages'},
ru:{days:n=>{const a=n%10,b=n%100;return a===1&&b!==11?'день':(a>=2&&a<=4&&(b<12||b>14))?'дня':'дней'},hero:'Лучшая текущая серия',sub:n=>'Привычек в трекере: '+n,bad:'Бросаю',good:'Вырабатываю',
slip:'Сорвался',check:'Отметить сегодня',checked:'Отмечено сегодня',del:'Удалить',confirm:'Удалить эту привычку?',best:'Рекорд',next:(n,d)=>'Следующая отметка: '+n+' дн. (осталось '+d+')',top:'Высшая отметка достигнута',
tag:'Считайте дни, которые вы держитесь.',go:'Начать меняться',tabP:'Прогресс',tabH:'Привычки',sbad:'Вредные привычки',sgood:'Полезные привычки',none:'Пока пусто.',by:'от Danfamla',name:'Теперь иначе',home:'‹ Домой',light:'Светлая тема',dark:'Тёмная тема',add:'Новая привычка',ph:'Что хотите бросить или выработать?',tBad:'Бросить привычку',tGood:'Выработать привычку',addBtn:'Добавить',empty:'Пока нет привычек. Добавьте первую ниже.',s1:'Залипание в соцсетях',s2:'Чтение 10 страниц'}};
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/DAY);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,newType='bad';
function seed(){const t=today();return{lang:'ru',habits:[
{id:'a1',key:'s1',type:'bad',start:Date.now()-12.4*DAY,best:12},
{id:'a2',key:'s2',type:'good',checks:[t-4,t-3,t-2,t-1,t],best:5}]}}
function load(){try{const r=localStorage.getItem('cleandays');if(r){S=JSON.parse(r)}}catch(e){}
if(!S||!Array.isArray(S.habits))S=seed()}
function save(){try{localStorage.setItem('cleandays',JSON.stringify(S))}catch(e){}}
function runs(c){const a=[...new Set(c)].sort((x,y)=>x-y);let b=0,r=0;a.forEach((d,i)=>{r=(i&&d===a[i-1]+1)?r+1:1;b=Math.max(b,r)});return b}
function cur(h){if(h.type==='bad')return Math.max(0,Math.floor((Date.now()-h.start)/DAY));
let d=today();if(!h.checks.includes(d))d--;let n=0;while(h.checks.includes(d)){n++;d--}return n}
function best(h){return Math.max(h.best||0,cur(h),h.type==='good'?runs(h.checks):0)}
function render(){const L=T[S.lang];document.documentElement.lang=S.lang;
document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===S.lang));
const vals=S.habits.map(cur),top=vals.length?Math.max(...vals):0;
document.getElementById('hero').innerHTML='<div class="big">'+top+'</div><p>'+L.days(top)+' · '+L.hero+'<br>'+L.sub(S.habits.length)+'</p>';
document.getElementById('list').innerHTML=S.habits.length?S.habits.map(h=>{const v=cur(h),nm=h.key?L[h.key]:esc(h.name);
const segs=MS.map((m,i)=>{const lo=i?MS[i-1]:0,p=v>=m?100:v<=lo?0:(v-lo)/(m-lo)*100;return '<div class="seg'+(v>=m?' done':'')+'"><i style="width:'+p+'%"></i></div>'}).join('');
const marks=MS.map(m=>'<span class="'+(v>=m?'done':'')+'">'+m+'</span>').join('');
const nx=MS.find(m=>m>v),nt=nx?L.next(nx,nx-v):L.top;
const act=h.type==='bad'?'<button class="btn" data-act="slip" data-id="'+h.id+'">'+L.slip+'</button>':
'<button class="btn pri" data-act="check" data-id="'+h.id+'"'+(h.checks.includes(today())?' disabled>'+L.checked:'>'+L.check)+'</button>';
return '<article class="card"><div class="top"><div><div class="name">'+nm+'</div><span class="tag">'+(h.type==='bad'?L.bad:L.good)+' · '+L.best+' '+best(h)+'</span></div><div class="val">'+v+'<small>'+L.days(v)+'</small></div></div>'+
'<div class="track">'+segs+'</div><div class="marks">'+marks+'</div><p class="next">'+nt+'</p><div class="acts">'+act+'</div></article>'}).join(''):'<p class="empty">'+L.empty+'</p>';
renderHabits();document.getElementById('tabP').textContent=L.tabP;document.getElementById('tabH').textContent=L.tabH;document.getElementById('pProgress').hidden=tab!=='progress';document.getElementById('pHabits').hidden=tab!=='habits';document.querySelectorAll('.tabs button').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});document.getElementById('addTitle').textContent=L.add;document.getElementById('tag').textContent=TAGS[S.lang][tagIdx];document.getElementById('home2').textContent=L.home;document.getElementById('appname').textContent=L.name;document.getElementById('by').textContent=L.by;document.getElementById('home').textContent=L.name;document.title=L.name;document.getElementById('logo').setAttribute('aria-label',L.name);document.getElementById('go').textContent=L.go;document.querySelectorAll('#theme button').forEach(b=>{b.classList.toggle('on',b.dataset.theme===curTheme());b.setAttribute('aria-label',L[b.dataset.theme])});document.getElementById('newName').placeholder=L.ph;
document.getElementById('tBad').textContent=L.tBad;document.getElementById('tGood').textContent=L.tGood;document.getElementById('addBtn').textContent=L.addBtn;
document.getElementById('tBad').classList.toggle('on',newType==='bad');document.getElementById('tGood').classList.toggle('on',newType==='good')}
function add(){const i=document.getElementById('newName'),n=i.value.trim();if(!n)return;
const h={id:'h'+Date.now(),name:n,type:newType,best:0};if(newType==='bad')h.start=Date.now();else h.checks=[];
S.habits.push(h);i.value='';save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.lang){S.lang=b.dataset.lang}
else if(b.dataset.tab){tab=b.dataset.tab}
else if(b.dataset.theme){S.theme=b.dataset.theme;applyTheme()}
else if(b.id==='go'){location.hash='tracker';return}
else if(b.id==='home'||b.id==='home2'){pickTag();render();location.replace('#home');return}
else if(b.dataset.type){newType=b.dataset.type}
else if(b.id==='addBtn'){add();return}
else if(b.dataset.act){const h=S.habits.find(x=>x.id===b.dataset.id);if(!h)return;
if(b.dataset.act==='del'){if(!confirm(T[S.lang].confirm))return;S.habits=S.habits.filter(x=>x!==h)}
else if(b.dataset.act==='slip'){h.best=best(h);h.start=Date.now()}
else if(b.dataset.act==='check'){const t=today();if(!h.checks.includes(t))h.checks.push(t)}}
else return;
save();render()});
document.getElementById('newName').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
const TAGS={en:['Count the days you hold out.','One day at a time. Start with today.','Every day without it is a win.','Small steps, big change.','Your streak starts today.','Hold on. Today counts.','Build the life you want, one day at a time.','Today is a good day to begin.','You’ve got this. One more day.','Hold out today. Tomorrow will be easier.','Every day is a new beginning.','Leave the old habit behind.','Be proud of every day you hold on.','Start where you are, with what you have.','A new day, a new you.','Stronger than yesterday.','Don’t break the chain.','Choose yourself today.','Progress, not perfection.','Your future self says thank you.'],ru:['Считайте дни, которые вы держитесь.','Один день за раз. Начните с сегодня.','Каждый день без этого — победа.','Маленькие шаги — большие перемены.','Ваша серия начинается сегодня.','Держитесь. Сегодня засчитывается.','Стройте нужную жизнь по одному дню.','Сегодня хороший день, чтобы начать.','У вас получится. Ещё один день.','Продержитесь сегодня. Завтра будет легче.','Каждый день — новое начало.','Оставьте старую привычку позади.','Гордитесь каждым днём без срывов.','Начните с того, что есть.','Новый день — новый вы.','Сильнее, чем вчера.','Не прерывайте цепочку.','Выберите себя сегодня.','Прогресс, а не идеал.','Вы в будущем скажете себе спасибо.']};
let tagIdx=0;let tab='progress';
function renderHabits(){const L=T[S.lang];const sec=(type,title)=>{const hs=S.habits.filter(h=>h.type===type);return '<h2 class="sec">'+title+'</h2>'+(hs.length?hs.map(h=>{const nm=h.key?L[h.key]:esc(h.name),v=cur(h);return '<div class="card hrow"><div><div class="name">'+nm+'</div><span class="tag">'+L.best+' '+best(h)+'</span></div><div class="hr2"><div class="hv">'+v+' '+L.days(v)+'</div><button class="btn del" data-act="del" data-id="'+h.id+'">'+L.del+'</button></div></div>'}).join(''):'<p class="empty">'+L.none+'</p>')};document.getElementById('hlists').innerHTML=sec('bad',L.sbad)+sec('good',L.sgood)}
function pickTag(){let last=-1;try{const v=localStorage.getItem('anew_tag');if(v!==null)last=+v}catch(e){}
let i;do{i=Math.floor(Math.random()*TAGS.en.length)}while(i===last);tagIdx=i;try{localStorage.setItem('anew_tag',String(i))}catch(e){}}
function curTheme(){return S.theme||'light'}
function applyTheme(){const t=curTheme();document.documentElement.setAttribute('data-theme',t);const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#080c0c':'#f1f3f2')}
function show(app){document.getElementById('start').hidden=app;document.getElementById('app').hidden=!app;window.scrollTo(0,0)}
function route(){show(location.hash==='#tracker')}
window.addEventListener('hashchange',route);
document.getElementById('logo').addEventListener('click',()=>{const l=document.getElementById('logo');l.classList.remove('play');void l.getBoundingClientRect();l.classList.add('play')});
pickTag();load();applyTheme();render();
if(location.hash==='#tracker')location.replace('#home');
route();
</script>
</body>
</html>
