const CMF={en:['It’s okay. One slip doesn’t erase what you’ve built.','Be kind to yourself. You’re still trying, and that counts.','Setbacks are part of changing. Take a breath, then start again.','You’ve done it before, you can do it again.','This isn’t the end of your progress. It’s a pause.','Every day you held on taught you something. That stays with you.','Falling is not failing. Staying down is. You’re already getting up.','You don’t have to be perfect. You just have to keep going.','Be as patient with yourself as you would be with a friend.','One hard moment doesn’t define you.','What matters is what you do next. Start with one small step.','You’re stronger than this moment.','Progress isn’t a straight line. This is part of the path.','You noticed it and you pressed the button. That takes honesty and courage.','Tomorrow is a fresh page. Today, just rest and breathe.','Every attempt makes the next one easier.','You’re allowed to start over as many times as you need.','Your reasons for changing are still there. Remember them.','This feels heavy now, but it will pass.','The days you held on were real, and nobody can take them away.'],ru:['Ничего страшного. Один срыв не стирает всё, что вы сделали.','Будьте добры к себе. Вы всё ещё стараетесь, и это важно.','Срывы бывают на пути к переменам. Вдохните и начните снова.','У вас уже получалось, получится и снова.','Это не конец прогресса, а пауза.','Каждый день, который вы держались, чему-то вас научил. Это остаётся с вами.','Упасть — не значит проиграть. Проиграть — значит не вставать. А вы уже встаёте.','Не нужно быть идеальным. Нужно просто продолжать.','Будьте так же терпеливы к себе, как были бы к другу.','Один тяжёлый момент не определяет вас.','Важно то, что вы сделаете дальше. Начните с одного маленького шага.','Вы сильнее этого момента.','Прогресс не бывает по прямой. Это часть пути.','Вы заметили это и нажали кнопку. Для этого нужны честность и смелость.','Завтра чистая страница. Сегодня просто отдохните и подышите.','Каждая попытка облегчает следующую.','Начинать заново можно столько раз, сколько нужно.','Причины, по которым вы меняетесь, никуда не делись. Вспомните их.','Сейчас тяжело, но это пройдёт.','Дни, которые вы продержались, были настоящими, и их никто не отнимет.']};
const CMT={en:['It’s okay','You’ve got this','This isn’t the end','Hang in there','It can be fixed'],ru:['Всё в порядке','У вас получится','Это не конец','Держитесь','Всё поправимо']};
function nextIdx(key,len){let bag=[],last=-1;try{bag=JSON.parse(localStorage.getItem(key)||'[]');const l=localStorage.getItem(key+'_l');if(l!==null)last=+l}catch(e){}
if(!Array.isArray(bag))bag=[];bag=bag.filter(i=>i>=0&&i<len);
if(!bag.length){bag=[];for(let i=0;i<len;i++)bag.push(i);for(let i=len-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)),t=bag[i];bag[i]=bag[j];bag[j]=t}if(len>1&&bag[bag.length-1]===last){const t=bag[0];bag[0]=bag[bag.length-1];bag[bag.length-1]=t}}
const i=bag.pop();try{localStorage.setItem(key,JSON.stringify(bag));localStorage.setItem(key+'_l',String(i))}catch(e){}return i}
function showCmf(n,b,id){const L=T[S.lang],a=CMF[S.lang];document.getElementById('cT').textContent=CMT[S.lang][nextIdx('anew_ct',CMT.en.length)];document.getElementById('cM').textContent=a[nextIdx('anew_cm',a.length)];document.getElementById('cB').textContent=L.cf(n,b);document.getElementById('cGo').textContent=L.cGo;document.getElementById('b1').textContent=L.bi;document.getElementById('b2').textContent=L.bo;document.getElementById('cmf').hidden=false;document.getElementById('cGo').focus();const c=document.querySelector('.card[data-cid="'+id+'"]');if(c){c.classList.add('soft');setTimeout(()=>c.classList.remove('soft'),1800)}}
function closeCmf(){document.getElementById('cmf').hidden=true}
function hname(h){const pp=h.pre&&PRE[h.type].find(x=>x[0]===h.pre);return pp?pp[S.lang==='ru'?2:1]:(h.key?T[S.lang][h.key]:h.name)}
function checkMs(){let ch=false;S.habits.forEach(h=>{const v=cur(h),top=MS.filter(m=>v>=m).pop()||0;if(h.ms===undefined){h.ms=top;ch=true}else if(top>h.ms){h.ms=top;pend.push({id:h.id,m:top});ch=true}else if(top<h.ms){h.ms=top;ch=true}});if(ch)save();if(pend.length)setTimeout(flushCel,80)}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>{e.hidden=true},3400)}
function flushCel(){if(!pend.length||document.getElementById('app').hidden||tab!=='progress')return;const items=pend;pend=[];let last=null;items.forEach(x=>{const h=S.habits.find(y=>y.id===x.id);if(!h)return;last={h:h,m:x.m};const card=document.querySelector('.card[data-cid="'+x.id+'"]');if(!card)return;const seg=card.querySelector('.seg[data-m="'+x.m+'"]');card.classList.add('cel');setTimeout(()=>card.classList.remove('cel'),1500);if(seg){seg.classList.remove('unlock');void seg.offsetWidth;seg.classList.add('unlock');const tr=card.querySelector('.track'),cx=seg.offsetLeft+seg.offsetWidth/2,cy=seg.offsetTop+4;for(let i=0;i<12;i++){const s=document.createElement('i');s.className='spark';const a=Math.PI*2*i/12,d=26+Math.random()*22;s.style.cssText='left:'+cx+'px;top:'+cy+'px;--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d)+'px';tr.appendChild(s);setTimeout(()=>s.remove(),1000)}}});if(last){const L=T[S.lang];toast('\u2605 '+L.ms+': '+hname(last.h)+' \u2014 '+last.m+' '+L.days(last.m))}}let tab='progress';let sel={};
const PRE={bad:[['smoke','Smoking','Курение'],['alc','Alcohol','Алкоголь'],['scroll','Scrolling social media','Залипание в соцсетях'],['sweet','Sweets and sugar','Сладкое и сахар'],['junk','Fast food','Фастфуд'],['proc','Laziness','Лень'],['nail','Nail biting','Грызть ногти'],['game','Too much gaming','Слишком много игр']],good:[['sport','Exercise','Спорт'],['water','Drinking water','Пить воду'],['read','Reading','Чтение'],['walk','Walking','Прогулки'],['sleep','Going to bed on time','Ложиться спать вовремя'],['med','Meditation','Медитация'],['learn','Learning new things','Учиться новому'],['eat','Healthy eating','Здоровое питание']]};
function renderPick(){const L=T[S.lang],li=S.lang==='ru'?2:1;
const chips=t=>PRE[t].map((p,i)=>'<button class="chip'+(sel[p[0]]?' on':'')+'" style="--i:'+i+'" data-pre="'+p[0]+'" data-ptype="'+t+'">'+p[li]+'</button>').join('')+Object.keys(sel).filter(k=>k[0]==='c'&&sel[k].type===t).map(k=>'<button class="chip on" data-pre="'+k+'" data-ptype="'+t+'">'+esc(sel[k].name)+'</button>').join('');
document.getElementById('chBad').innerHTML=chips('bad');document.getElementById('chGood').innerHTML=chips('good');
document.getElementById('pTitle').textContent=L.pTitle;document.getElementById('pSub').textContent=L.pSub;document.getElementById('hBad').textContent=L.pBad;document.getElementById('hGood').textContent=L.pGood;
document.getElementById('cBad').placeholder=L.pPh;document.getElementById('cGood').placeholder=L.pPh;document.getElementById('home3').textContent=L.home;document.getElementById('done').textContent=L.done;
updDone()}
function updDone(){const d=document.getElementById('done'),was=d.disabled,ok=!!(Object.keys(sel).length||document.getElementById('cBad').value.trim()||document.getElementById('cGood').value.trim());d.disabled=!ok;if(was&&ok){d.classList.remove('bump');void d.offsetWidth;d.classList.add('bump')}}
function addCustom(type){const i=document.getElementById(type==='bad'?'cBad':'cGood'),n=i.value.trim();if(!n)return;const k='c'+Date.now();sel[k]={type:type,name:n};i.value='';renderPick();const el=document.querySelector('[data-pre="'+k+'"]');if(el){el.classList.add('bump')}}
function askDel(h,kind){delId=h.id;delKind=kind||'del';const r=delKind==='reset',L=T[S.lang],pp=h.pre&&PRE[h.type].find(x=>x[0]===h.pre),nm=pp?pp[S.lang==='ru'?2:1]:h.name;document.getElementById('dq').textContent=(r?L.rq:L.dq)+' '+L.q1+nm+L.q2+'?';document.getElementById('dn').textContent=r?L.rn:L.dn;document.getElementById('dno').textContent=L.dno;document.getElementById('dyes').textContent=r?L.ryes:L.dyes;document.getElementById('dlg').hidden=false;document.getElementById('dno').focus()}
function closeDel(){delId=null;document.getElementById('dlg').hidden=true}
function finishPick(){['bad','good'].forEach(t=>{const i=document.getElementById(t==='bad'?'cBad':'cGood'),n=i.value.trim();if(n){sel['c'+Date.now()+t]={type:t,name:n};i.value=''}});const hs=[];Object.keys(sel).forEach(k=>{const e=sel[k],p=PRE[e.type].find(x=>x[0]===k);const h={id:'h'+Date.now()+k,name:p?p[S.lang==='ru'?2:1]:e.name,type:e.type,best:0};if(p)h.pre=k;if(e.type==='bad')h.start=Date.now();else h.checks=[];hs.push(h)});S.habits=hs;S.onboarded=true;sel={};save();render();route()}
function renderHabits(){const L=T[S.lang];const sec=(type,title)=>{const hs=S.habits.filter(h=>h.type===type);return '<div class="hcol"><h2 class="sec">'+title+'</h2>'+(hs.length?hs.map((h,idx)=>{const pp=h.pre&&PRE[h.type].find(x=>x[0]===h.pre),nm=pp?pp[S.lang==='ru'?2:1]:esc(h.name),v=cur(h);return '<div class="card hrow'+(seen.has(h.id)?'':' rin')+'" data-rid="'+h.id+'" style="--i:'+idx+'"><div><div class="name">'+nm+'</div><span class="tag">'+L.best+' '+best(h)+'</span></div><div class="hr2"><div class="hv">'+v+' '+L.days(v)+'</div><button class="btn del" data-act="del" data-id="'+h.id+'">'+L.del+'</button></div></div>'}).join(''):'<p class="empty">'+L.none+'</p>')+'</div>'};document.getElementById('hlists').innerHTML=sec('bad',L.sbad)+sec('good',L.sgood);S.habits.forEach(h=>seen.add(h.id))}
function pickTag(){let last=-1;try{const v=localStorage.getItem('anew_tag');if(v!==null)last=+v}catch(e){}
let i;do{i=Math.floor(Math.random()*TAGS.en.length)}while(i===last);tagIdx=i;try{localStorage.setItem('anew_tag',String(i))}catch(e){}}
function curTheme(){return S.theme||'light'}
function applyTheme(){const t=curTheme();document.documentElement.setAttribute('data-theme',t);const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#080c0c':'#f1f3f2')}
function show(s){['start','pick','app'].forEach(id=>{document.getElementById(id).hidden=id!==s});window.scrollTo(0,0);if(s==='app')setTimeout(flushCel,450);if(s==='pick'){const p=document.getElementById('pick');p.classList.add('enter');clearTimeout(window._en);window._en=setTimeout(()=>p.classList.remove('enter'),1800)}}
function route(){const h=location.hash;show(h==='#tracker'?(S.onboarded?'app':'pick'):h==='#choose'?'pick':'start')}
document.getElementById('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeDel()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDel();closeCmf()}});
document.getElementById('cmf').addEventListener('click',e=>{if(e.target.id==='cmf')closeCmf()});
window.addEventListener('hashchange',route);
document.getElementById('logo').addEventListener('click',()=>{const l=document.getElementById('logo');l.classList.remove('play');void l.getBoundingClientRect();l.classList.add('play')});
pickTag();load();applyTheme();render();
if(location.hash==='#tracker'||location.hash==='#choose')location.replace('#home');
route();
</script>
